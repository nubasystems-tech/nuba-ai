<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>NUBA AI — Promo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4a017; --gold2:#f0c948; --sand:#c2a06b; --sand2:#e8d5a8;
  --palm:#2e7d4f; --nile:#1c6ba0; --nile2:#3a9ad9;
  --ink:#0b0e16;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:'Cairo','Inter',sans-serif;color:#f5f1e6}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}

/* طبقات الخلفية */
.bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.6s ease, transform 9s linear;transform:scale(1.12)}
.bg-slide.on{opacity:1;transform:scale(1)}
.bg-slide::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,14,22,.72),rgba(11,14,22,.45) 45%,rgba(11,14,22,.88)),
             radial-gradient(ellipse at 50% 40%,transparent,rgba(11,14,22,.5))}

/* جزيئات ذهبية */
#dust{position:absolute;inset:0;pointer-events:none}

/* المحتوى */
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;z-index:5}

/* الشعار N */
.logo-3d{position:relative;width:200px;height:200px;margin-bottom:34px;
  display:grid;place-items:center;perspective:900px}
.n-letter{font-family:'Inter';font-weight:900;font-size:150px;line-height:1;
  color:transparent;background:linear-gradient(160deg,#f7e08a 0%,var(--gold2) 30%,var(--gold) 55%,#8a6d1d 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 34px rgba(240,201,72,.55));
  transform-style:preserve-3d;animation:nSpin 9s ease-in-out infinite}
@keyframes nSpin{0%,100%{transform:rotateY(-14deg) rotateX(6deg)}
  50%{transform:rotateY(14deg) rotateX(-4deg)}}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(240,201,72,.35);
  animation:ringPulse 3.2s ease-in-out infinite}
.ring.r1{width:230px;height:230px}
.ring.r2{width:270px;height:270px;animation-delay:.6s;border-color:rgba(58,154,217,.3)}
.ring.r3{width:310px;height:310px;animation-delay:1.2s;border-color:rgba(240,201,72,.18)}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:.25}}

/* اسم NUBA AI */
.word{font-family:'Inter','Cairo';font-weight:900;letter-spacing:14px;font-size:clamp(52px,11vw,128px);
  background:linear-gradient(180deg,#fff 15%,var(--sand2) 45%,var(--gold) 75%,#9a7a1a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(0,0,0,.6));
  display:flex;gap:.35em;justify-content:center}
.word span{display:inline-block;opacity:0;transform:translateY(60px) rotateX(70deg) scale(.6);
  animation:letterIn .8s cubic-bezier(.2,.9,.3,1.2) forwards}
.word .sp{width:.5em}
@keyframes letterIn{to{opacity:1;transform:none}}

/* الشعارات الفرعية */
.tagline{margin-top:26px;font-size:clamp(15px,3vw,30px);font-weight:600;color:var(--sand2);
  opacity:0;animation:fadeUp 1s 1.6s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.tagline b{color:var(--gold2)}
.sub{margin-top:12px;font-size:clamp(12px,2vw,19px);font-weight:300;color:#cbbfa0;
  opacity:0;animation:fadeUp 1s 2s cubic-bezier(.2,.9,.3,1) forwards}
.sub i{font-style:normal;color:var(--nile2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* شريط الهوية أسفل */
.identity{position:absolute;bottom:52px;left:0;right:0;display:flex;justify-content:center;gap:clamp(18px,4vw,54px);
  z-index:6}
.id-item{display:flex;flex-direction:column;align-items:center;gap:9px;
  opacity:0;transform:translateY(30px);animation:fadeUp .9s forwards}
.id-item .ico{font-size:clamp(26px,5vw,44px);filter:drop-shadow(0 4px 16px rgba(0,0,0,.7))}
.id-item .lbl{font-size:clamp(10px,1.6vw,15px);font-weight:600;color:var(--sand2);letter-spacing:1px}
.id-item .bar{width:34px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--nile2))}

/* زر ختامي */
.cta{margin-top:40px;padding:16px 52px;border-radius:99px;font-size:clamp(14px,2.4vw,22px);font-weight:800;
  background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#8a6d1d);color:#1a1405;
  border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 44px rgba(212,160,23,.45);
  opacity:0;transform:scale(.8);animation:ctaIn .9s 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ctaIn{to{opacity:1;transform:scale(1)}}

/* التحكم بالتشغيل */
#replay{position:absolute;top:20px;left:20px;z-index:20;padding:8px 18px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#f5f1e6;
  font-family:'Cairo';font-size:13px;cursor:pointer;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div id="stage">
  <div class="bg-slide" id="bg1" style="background-image:url('bg_temple.jpg')"></div>
  <div class="bg-slide" id="bg2" style="background-image:url('bg_language.jpg')"></div>
  <div class="bg-slide" id="bg3" style="background-image:url('bg_prisoners.jpg')"></div>
  <canvas id="dust"></canvas>

  <div class="content">
    <div class="logo-3d">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="n-letter">N</div>
    </div>

    <div class="word" id="word"></div>

    <div class="tagline" id="tagline">من قلب <b>المملكة النوبية</b> — إلى العالم</div>
    <div class="sub" id="sub">ترجمة فورية بذكاء <i>AI</i> تحتمل الصوت الضعيف والضجيج وسرعة المتحدث</div>

    <div class="cta" id="cta">جرّب المترجم الآن</div>
  </div>

  <div class="identity">
    <div class="id-item" style="animation-delay:2.2s"><span class="ico">🥇</span><span class="lbl">الذهب</span><span class="bar"></span></div>
    <div class="id-item" style="animation-delay:2.4s"><span class="ico">🏜️</span><span class="lbl">الرمال</span><span class="bar"></span></div>
    <div class="id-item" style="animation-delay:2.6s"><span class="ico">🌴</span><span class="lbl">النخيل</span><span class="bar"></span></div>
    <div class="id-item" style="animation-delay:2.8s"><span class="ico">🌊</span><span class="lbl">النهر</span><span class="bar"></span></div>
    <div class="id-item" style="animation-delay:3.0s"><span class="ico">🤖</span><span class="lbl">AI</span><span class="bar"></span></div>
  </div>

  <button id="replay">↺ إعادة</button>
</div>

<script>
// كلمة NUBA AI حرفاً حرفاً
const word = document.getElementById("word");
const txt = "NUBA AI";
[...txt].forEach((ch, i) => {
  if (ch === " ") { word.innerHTML += `<span class="sp"></span>`; return; }
  const s = document.createElement("span");
  s.textContent = ch;
  s.style.animationDelay = (0.35 + i * 0.11) + "s";
  word.appendChild(s);
});

// تدوير الخلفيات الثلاث
const slides = [document.getElementById("bg1"), document.getElementById("bg2"), document.getElementById("bg3")];
let cur = 0;
slides[0].classList.add("on");
setInterval(() => {
  slides[cur].classList.remove("on");
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add("on");
}, 4000);

// جزيئات غبار ذهبي
const cv = document.getElementById("dust"), ctx = cv.getContext("2d");
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener("resize", resize);
const P = Array.from({length: 70}, () => ({
  x: Math.random() * innerWidth, y: Math.random() * innerHeight,
  r: .6 + Math.random() * 2.4, vy: .15 + Math.random() * .5,
  vx: (Math.random() - .5) * .3, a: .15 + Math.random() * .5,
  gold: Math.random() > .35
}));
(function dust(){
  requestAnimationFrame(dust);
  ctx.clearRect(0, 0, W, H);
  for (const p of P) {
    p.y -= p.vy; p.x += p.vx + Math.sin(p.y / 40) * .12;
    if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
    ctx.beginPath();
    ctx.fillStyle = p.gold ? `rgba(240,201,72,${p.a})` : `rgba(58,154,217,${p.a * .8})`;
    ctx.arc(p.x, p.y, p.r, 0, 7);
    ctx.fill();
  }
})();

// إعادة تشغيل الأنيميشن كاملة
document.getElementById("replay").onclick = () => location.reload();
</script>
</body>
</html>
